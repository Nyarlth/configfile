# Please note not all available settings / options are set here.
# For a full list, see the wiki
#


# See https://wiki.hyprland.org/Configuring/Monitors/
monitor=,3072x1920@120,0x0,2
#monitor= HDMI-A-1,3840x2160@30,0x0,2 , mirror,eDP-1
monitor= HDMI-A-1, 1920x1080@60, 1536x-2100,1, transform,3, workspace,20
#workspace = 20, monitor:HDMI-A-1

# See https://wiki.hyprland.org/Configuring/Keywords/ for more

# Execute your favorite apps at launch
# exec-once = waybar & hyprpaper & firefox

# Source a file (multi-file configs)
# source = ~/.config/hypr/myColors.conf

# Some default env vars.
source = ~/.config/hypr/env.conf

# For all categories, see https://wiki.hyprland.org/Configuring/Variables/
input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    follow_mouse = 1

    touchpad {
        natural_scroll = yes
    }
    sensitivity = 0.7 # -1.0 - 1.0, 0 means no modification.
    accel_profile = flat
}

general {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more

    gaps_in = 3
    gaps_out = 5,5,5,5
    border_size = 0
    col.active_border = rgba(ff000000) rgba(ffffffff) rgba(ff000000) rgba(ffffffff) 45deg
    col.inactive_border = rgba(11707b7c)
    resize_on_border = true
    no_border_on_floating = true
    layout = dwindle
#    cursor_inactive_timeout = 1
}


decoration {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more

    rounding = 10
    active_opacity = 1
    inactive_opacity = 1
    fullscreen_opacity = 1
    blur {
        enabled = true
        size = 1
        passes = 2
	ignore_opacity = false
    }
  shadow{
      enabled = true
      range = 10
      render_power = 4
      color = 0xffa7caff
      color_inactive = 0x50000000
    }
}
layerrule = blur, waybar
layerrule = ignorezero, waybar
xwayland {
  force_zero_scaling = true
}

animations {
    enabled = yes

    # Some default animations, see https://wiki.hyprland.org/Configuring/Animations/ for more

    bezier = myBezier, 0.05, 0.9, 0.1, 1.05

    animation = windows, 1, 5, myBezier, popin 70%
    animation = windowsOut, 1, 3, default, popin 80%
    animation = border, 1, 3 , default
    animation = borderangle, 1, 3, default
    animation = fade, 1, 3, default
    animation = specialWorkspace, 1, 3, myBezier,fade
    animation = workspaces, 1, 3, default, slidefade 20%
}

dwindle {
    # See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
    pseudotile = yes # master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = yes # you probably want this
}

master {
    # See https://wiki.hyprland.org/Configuring/Master-Layout/ for more
#    new_is_master = true
}

gestures {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more
    workspace_swipe = on
}

misc {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more
    force_default_wallpaper = -1 # Set to 0 to disable the anime mascot wallpapers
}

# Example per-device config
# See https://wiki.hyprland.org/Configuring/Keywords/#executing for more
# device:epic-mouse-v1 {
#    sensitivity = -0.5
# }

# Example windowrule v1
# windowrule = float, ^(kitty)$
# Example windowrule v2
# windowrulev2 = float,class:^(kitty)$,title:^(kitty)$
# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more

# auto shart 
source = ~/.config/hypr/exec_a.conf

# key binds
source = ~/.config/hypr/bindkeys.conf



# layer rule
layerrule = blur, gtk-layer-shell
layerrule = ignorezero, gtk-layer-shell


# window rule 
source = ~/.config/hypr/rule.conf
